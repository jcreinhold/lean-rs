[package]
authors.workspace = true
categories = ["api-bindings", "external-ffi-bindings"]
description = "Safe Rust bindings for Lean 4 interop: runtime initialization, object handles, typed ABI conversions, module loading, exported function calls, semantic handles, and callback handles."
documentation = "https://docs.rs/lean-rs"
edition.workspace = true
include = [
  "Cargo.toml",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "benches/**/*.rs",
  "build.rs",
  "examples/**/*.rs",
  "src/**/*.rs",
  "tests/**/*.rs",
  "tests/compile_fail/**",
]
keywords = ["bindings", "embedding", "host", "lean", "lean4"]
license.workspace = true
name = "lean-rs"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
lean-rs-sys = { workspace = true }
lean-toolchain = { workspace = true }
libloading = "0.8"
# Symbol-table walk in `module::library` distinguishes Lean nullary-constant
# globals (compiled by Lake as persistent `lean_object*` data-section
# symbols) from callable functions. One-shot at `LeanLibrary::open` so the
# function-vs-global distinction stays invisible to callers of
# `LeanModule::exported_unchecked`.
object = { version = "0.36", default-features = false, features = ["read", "std"] }
serde_json = { workspace = true }
# Structured spans + events around runtime init, module load + dispatch,
# and host session calls. The crate installs no subscriber; applications
# attach their own. Cost is one atomic load per span entry when no
# subscriber is attached.
tracing = { workspace = true }

[features]
# Opens a narrow set of `pub(crate)` ABI decoders as `pub fn` entry
# points so the in-tree `fuzz/` crate (cargo-fuzz, nightly-only) can
# drive them with `lean-rs-sys`-constructed Lean-shaped inputs.
#
# This feature is **not** semver-stable: it is intentionally invisible
# in published documentation and is gated solely for fuzzing
# infrastructure. The exposed surface is the `lean_rs::abi::fuzz_entry`
# module; it is not re-exported at the crate root.
fuzzing = []

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dev-dependencies]
sha2 = { workspace = true }
# Heap profiler for `examples/alloc_probe.rs`. Installs `dhat::Alloc` as the
# *Rust* global allocator; Lean's internal mimalloc (statically linked into
# `libleanrt.a`) is a separate allocator and unaffected. Dev-only — never
# pulled into the published library build.
dhat = "0.3"
# Criterion drives the steady-state hot-path and session-path baselines
# under `benches/`. Cold paths (runtime init, library open, module init)
# run once per process, so they live in `examples/cold_probe.rs` instead.
criterion = { workspace = true }
# Examples under `examples/` install a `tracing_subscriber::fmt`
# sink so `RUST_LOG=lean_rs=info cargo run --example <name>` surfaces
# the spans the crate emits. The library itself does not depend on it.
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# Drives the `tests/compile_fail/*.rs` negative cases from
# `tests/compile_fail_surface.rs`; gated behind `RUN_TRYBUILD=1` so the
# OS/rustc-sensitive `.stderr` snapshots run only in the pinned CI job.
trybuild = "1"

[[bench]]
harness = false
name = "hot_paths"

[[example]]
name = "cold_probe"

[[example]]
name = "alloc_probe"

[lints]
workspace = true

[lib]
doctest = false

# `tests/compile_fail/*.rs` are driven by trybuild from
# `tests/compile_fail_surface.rs` via string-based `t.compile_fail(...)` calls,
# which cargo-shear cannot see statically.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]
