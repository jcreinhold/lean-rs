[package]
authors.workspace = true
build = "build.rs"
categories = ["api-bindings"]
description = "Child-process runtime for the lean-rs worker boundary."
documentation = "https://docs.rs/lean-rs-worker-child"
edition.workspace = true
include = [
  "Cargo.toml",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "build.rs",
  "examples/**/*.rs",
  "src/**/*.rs",
  "tests/**/*.rs",
]
keywords = ["ipc", "lean", "lean4", "runtime", "worker"]
license.workspace = true
name = "lean-rs-worker-child"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
lean-rs = { workspace = true }
lean-rs-host = { workspace = true }
lean-rs-worker-protocol = { workspace = true }
lean-toolchain = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Raw Unix calls in the worker child: `child::install_immediate_abort_exit`
# sets `RLIMIT_CORE` to 0 and exits at once on `SIGABRT`, so an abort does not
# wait on a core-dump handler such as apport; `parent_watchdog` reads the
# parent's lifeline pipe; `host_artifacts` opens installed artifacts with
# `O_NOFOLLOW`.
libc = "0.2"

[dev-dependencies]
lean-rs-worker-parent = { workspace = true }
lean-rs-worker-protocol = { workspace = true, features = ["harness"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
# The parent-death test clears the close-on-exec flag on its probe and, on Linux,
# reaps the orphaned worker as its subreaper, without unsafe code.
rustix = { version = "1.1.6", features = ["process"] }

[[bin]]
name = "lean-rs-worker-child"
path = "src/bin/lean-rs-worker-child.rs"

[lints]
workspace = true

[lib]
doctest = false

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
