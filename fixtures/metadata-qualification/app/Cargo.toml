[package]
name = "metadata-qualification"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
serde = {version="1",features=["derive"]}
serde_json="1"
sha2="0.11"
libc="0.2"
rustix={version="1",features=["fs","process"]}
lean-toolchain = {path = "../../../crates/lean-toolchain"}
lean-rs = {path = "../../../crates/lean-rs"}
lean-rs-host = {path = "../../../crates/lean-rs-host"}
lean-rs-worker-parent = {path = "../../../crates/lean-rs-worker-parent"}
lean-rs-worker-child = {path = "../../../crates/lean-rs-worker-child"}
lean-rs-worker-protocol = {path = "../../../crates/lean-rs-worker-protocol"}

[target.'cfg(target_os = "macos")'.dependencies]
mach2="0.6"

[profile.dev.package.sha2]
opt-level = 3

[features]
admitted = []

[[bin]]
name = "metadata-worker"
path = "src/bin/metadata-worker.rs"
required-features = ["admitted"]

[[bin]]
name = "control"
path = "src/bin/control.rs"
required-features = ["admitted"]

[[bin]]
name = "substitute"
path = "src/bin/substitute.rs"
required-features = ["admitted"]
