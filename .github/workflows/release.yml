name: Release

# Tag-triggered release. Pushing a `v<semver>` tag (e.g. `v0.1.1`, `v0.1.1-rc.1`)
# verifies head Lean on Ubuntu and macOS (`verify` job), publishes crates
# in dependency order (`publish` job, depends on `verify`), then creates
# a GitHub Release whose body is the matching `## [<version>]` section of
# `CHANGELOG.md`.
#
# Manual re-runs use `workflow_dispatch` with `dry_run: true` to exercise the
# gates without uploading or creating a release.
#
# `CARGO_REGISTRY_TOKEN` must be set in the repository secrets before the first
# tag push (see `docs/release.md`). The token is a scoped publish token from
# <https://crates.io/settings/tokens>.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all gates but skip the live publish and GitHub Release."
        type: boolean
        default: true

concurrency:
  # All release and recovery runs share this group, regardless of the selected ref.
  group: publish-lean-rs
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Head of the supported Lean window. The publish job runs once
  # against this version. CI dispatch owns the full compatibility sweep.
  # Bumping the window: update this AND the matrix in `verify` AND
  # `crates/lean-rs-abi/src/supported.rs`. See `docs/bump-toolchain.md`.
  LEAN_VERSION_HEAD: "4.36.0"

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Lean ${{ matrix.lean_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release-gate matrix: head Lean × both supported OSes (2 cells).
        # The full SUPPORTED_TOOLCHAINS sweep runs on demand via
        # `ci.yml`'s `workflow_dispatch` with `full_matrix: true`.
        # Rationale: runner cost; trailing-edge breakages tend to
        # surface in the docs/release.md known-issues list rather
        # than as silent regressions, and the version-window
        # SUPPORTED_TOOLCHAINS table is the source of truth.
        os: [ubuntu-latest, macos-latest]
        lean_version: ["4.36.0"]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify-${{ matrix.lean_version }}-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Set up workflow linters
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install elan + Lean ${{ matrix.lean_version }}
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v${{ matrix.lean_version }}
          "$HOME/.elan/bin/elan" toolchain install "leanprover/lean4:v${{ matrix.lean_version }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Export LEAN_SYSROOT
        run: |
          prefix=$(scripts/lean-release-prefix.sh "${{ matrix.lean_version }}")
          printf 'LEAN_SYSROOT=%s\n' "$prefix" >> "$GITHUB_ENV"

      - name: Pin workspace to Lean ${{ matrix.lean_version }}
        run: |
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs-host/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs-host/shims/lean-rs-host-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > fixtures/lean/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > fixtures/interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > templates/shipped-lean-crate/lean/lean-toolchain

      - name: Build Lake packages
        run: |
          chmod 700 fixtures/lean fixtures/interop-shims crates/lean-rs/shims/lean-rs-interop-shims
          (cd crates/lean-rs/shims/lean-rs-interop-shims && lake build)
          if [ "${{ matrix.lean_version }}" != "4.36.0" ]; then
            (cd crates/lean-rs-host/shims/lean-rs-interop-shims && lake -R -KleanRsGeneratedShims=true build)
            (cd crates/lean-rs-host/shims/lean-rs-host-shims && lake -R -KleanRsGeneratedShims=true build)
          fi
          (cd fixtures/lean && lake build)
          (cd fixtures/interop-shims && lake build)
          if [ "$RUNNER_OS" = "Linux" ]; then
            lean_lib_paths="$GITHUB_WORKSPACE/crates/lean-rs/shims/lean-rs-interop-shims/.lake/build/lib"
            if [ "${{ matrix.lean_version }}" != "4.36.0" ]; then
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-interop-shims/.lake/build/lib"
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-host-shims/.lake/build/lib"
            fi
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/lean/.lake/build/lib"
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/interop-shims/.lake/build/lib"
            echo "LD_LIBRARY_PATH=$lean_lib_paths${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Select job-owned scalar and callback fixtures
        if: matrix.lean_version == '4.36.0'
        run: python3 scripts/select_test_fixtures.py >> "$GITHUB_ENV"

      - name: Install Rust nightly for ABI fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install nightly --component rust-src

      - name: Install cargo-fuzz
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-fuzz --locked

      - name: ABI fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/lean-rs/fuzz
        # `ASAN_OPTIONS=detect_leaks=0` disables LeakSanitizer, which
        # ASan turns on by default on Linux. Lean's shared runtime
        # intentionally retains process-global allocations at shutdown
        # (the same reason `docs/safety/unsafe-inventory.md` excludes
        # Lean from Linux ASan instrumentation); LSan flags those at
        # process exit and the binary terminates non-zero before any
        # actual fuzz finding can be reported. libFuzzer's own
        # `-detect_leaks=0` flag does not turn off this exit-time
        # check — it only disables libFuzzer's intra-run leak loop.
        # The goal of this gate is ABI-decode coverage in the Rust
        # harness, not auditing Lean's runtime cleanup. LSan does not
        # run on macOS, so local repros on darwin won't see the
        # difference.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cargo +nightly fuzz run abi_decode -- -runs=200000 -max_total_time=120

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint workflows and their shell scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          actionlint
          shellcheck scripts/lean-release-prefix.sh scripts/publish-workspace.sh scripts/trybuild-linked-fixture-rustc.sh

      - name: Required SDK worker tests
        if: matrix.lean_version == '4.36.0'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ] && ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi
          cargo fetch --locked --manifest-path fixtures/metadata-qualification/app/Cargo.toml
          # Remove only the library path injected by this workflow's Lake setup.
          # The qualifier still refuses inherited preloads and other loader overrides.
          selection=$(env -u LD_LIBRARY_PATH python3 scripts/qualify_metadata.py broken-import --emit-host-selection --run-typed --workspace-shims)
          printf '%s\n' "$selection" | grep '^LEAN_RS_TEST_ORDINARY_HOST_SHIMS=' >> "$GITHUB_ENV"
          printf '%s\n' "$selection" | grep '^LEAN_RS_TEST_REMAINING_FILTER=' >> "$GITHUB_ENV"

      # See `ci.yml` for the rationale on `RUST_BACKTRACE=0` and
      # `LD_PRELOAD=libgcc_s.so.1` here.
      - name: cargo nextest run
        env:
          RUST_BACKTRACE: "0"
          LD_PRELOAD: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/x86_64-linux-gnu/libgcc_s.so.1' || '' }}
        run: |
          if [ "${{ matrix.lean_version }}" = "4.36.0" ]; then
            test -n "${LEAN_RS_TEST_REMAINING_FILTER-}"
            python3 scripts/qualify_metadata.py workspace-tests "$LEAN_RS_TEST_REMAINING_FILTER"
          else
            cargo nextest run --workspace --profile ci -j1
          fi

      - name: cargo test --doc
        run: cargo test --doc --workspace

      - name: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      # docs.rs builds only on Linux, so the docs.rs-mode build only
      # needs to run on the Ubuntu cell.
      - name: docs.rs compatibility doc build
        if: matrix.os == 'ubuntu-latest'
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      - name: Package tarball docs.rs simulation
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_package_docsrs.py

  publish:
    name: Publish ${{ github.ref_name }}
    needs: verify
    permissions:
      contents: write # Create the GitHub Release after the uploads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refuse uploads from a manual Release run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo '::error::Manual Release runs must use dry_run: true. Push the release tag to upload crates.'
          exit 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Read workspace version and verify release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-rs"))')
          expected="v${version}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match workspace version (expected $expected). Bump Cargo.toml or re-tag."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract CHANGELOG section for this release
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-body.md"; then
            echo "::error::No CHANGELOG section for [$version]; add one before tagging."
            exit 1
          fi
          echo "--- Release body ---"
          cat "$RUNNER_TEMP/release-body.md"
          echo "--- End release body ---"

      # `cargo public-api` renders nightly rustdoc to emit the structured JSON
      # form of the public surface. The nightly is date-pinned and invoked
      # explicitly (`cargo +nightly-2026-06-18 public-api`) so the diff is
      # reproducible: the auto-derived `StructuralPartialEq` bound on generic
      # types changes across nightlies, and the committed baselines are
      # generated with this exact nightly (+ cargo-public-api@0.52.0). Keep in
      # lockstep with ci.yml and scripts/prerelease.sh. See docs/api-review.md.
      - name: Install Rust nightly (for cargo-public-api)
        run: rustup toolchain install nightly-2026-06-18 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-publish-${{ env.LEAN_VERSION_HEAD }}

      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          # Pinned with the rustdoc nightly that generated docs/api-review/.
          tool: cargo-public-api@0.52.0

      - name: Install elan + Lean ${{ env.LEAN_VERSION_HEAD }}
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v${{ env.LEAN_VERSION_HEAD }}
          "$HOME/.elan/bin/elan" toolchain install "leanprover/lean4:v${{ env.LEAN_VERSION_HEAD }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Export LEAN_SYSROOT
        run: |
          prefix=$(scripts/lean-release-prefix.sh "${{ env.LEAN_VERSION_HEAD }}")
          printf 'LEAN_SYSROOT=%s\n' "$prefix" >> "$GITHUB_ENV"

      - name: Pin workspace to Lean ${{ env.LEAN_VERSION_HEAD }}
        run: |
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > crates/lean-rs/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > crates/lean-rs-host/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > crates/lean-rs-host/shims/lean-rs-host-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > fixtures/lean/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > fixtures/interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ env.LEAN_VERSION_HEAD }}" > templates/shipped-lean-crate/lean/lean-toolchain

      - name: Build Lake packages
        run: |
          (cd crates/lean-rs/shims/lean-rs-interop-shims && lake build)
          (cd crates/lean-rs-host/shims/lean-rs-interop-shims && lake -R -KleanRsGeneratedShims=true build)
          (cd crates/lean-rs-host/shims/lean-rs-host-shims && lake -R -KleanRsGeneratedShims=true build)
          (cd fixtures/lean && lake build)
          (cd fixtures/interop-shims && lake build)
          if [ "$RUNNER_OS" = "Linux" ]; then
            lean_lib_paths="$GITHUB_WORKSPACE/crates/lean-rs/shims/lean-rs-interop-shims/.lake/build/lib"
            if [ "${{ env.LEAN_VERSION_HEAD }}" != "4.36.0" ]; then
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-interop-shims/.lake/build/lib"
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-host-shims/.lake/build/lib"
            fi
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/lean/.lake/build/lib"
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/interop-shims/.lake/build/lib"
            echo "LD_LIBRARY_PATH=$lean_lib_paths${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Public-API diff vs committed baselines
        run: |
          set -euo pipefail
          fail=0
          for crate in lean-rs-sys lean-toolchain lean-rs-interop-shims lean-rs lean-rs-host lean-rs-worker-protocol lean-rs-worker-parent lean-rs-worker-child; do
            baseline="docs/api-review/${crate}-public.txt"
            if [ ! -f "$baseline" ]; then
              echo "::error::Missing baseline: $baseline"
              fail=1
              continue
            fi
            actual=$(mktemp)
            cargo +nightly-2026-06-18 public-api --simplified -p "$crate" > "$actual"
            if ! diff -u "$baseline" "$actual"; then
              echo "::error::Public-API drift for $crate. Regenerate $baseline in the same commit that bumps the version."
              fail=1
            fi
          done
          exit "$fail"

      # Idempotent per-crate publish in dependency order (see the script header
      # for why this replaces `cargo publish --workspace`: that command imposes a
      # single global deadline on index propagation and aborts the entire plan —
      # stranding the crates that had not uploaded yet — when one crate loses the
      # race, which then forced a separate recovery run on essentially every
      # release). This loop skips crates already on crates.io and waits per-crate,
      # so re-running this job after a partial upload completes the release
      # without burning a version. The same script backs `release-recover.yml`.
      - name: Verify packages without uploading
        if: inputs.dry_run == true
        run: scripts/publish-workspace.sh --dry-run

      - name: Verify and publish missing crates in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-workspace.sh

      - name: Create GitHub Release
        if: inputs.dry_run != true && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
