name: pages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build documentation from."
        type: string
        default: main
        required: true

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.3

      - name: Build site
        run: mdbook build docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/mdbook

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
