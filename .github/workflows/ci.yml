name: CI

# Pushes and pull requests check the head Lean release on Ubuntu and macOS.
# Dispatch full_matrix to test every supported version on both.
# The API baselines under docs/ are verification inputs even on a docs-only PR.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/api-review/*-public.txt"
      - "!.gitignore"
      - "!LICENSE-*"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/api-review/*-public.txt"
      - "!.gitignore"
      - "!LICENSE-*"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Check every supported Lean release."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Default: 1 (full backtrace on real failures). The nextest step
  # overrides to 0 because RUST_BACKTRACE=1 triggers libstd to walk the
  # stack on every panic, and Lean's `libleanshared.so` frames break
  # the glibc unwinder on Linux (the panic tests in `error::tests::*`
  # SEGV during backtrace capture, not during the panic itself).
  RUST_BACKTRACE: 1

jobs:
  rust-line-width:
    name: Rust line width
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check added Rust lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_rust_line_width.py "$BASE"

  check:
    name: ${{ matrix.os }} / Lean ${{ matrix.lean_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lean_version: >-
          ${{ fromJSON(inputs.full_matrix &&
            '["4.30.0", "4.31.0-rc1", "4.31.0-rc2", "4.31.0", "4.32.0-rc1", "4.32.0", "4.32.2",
              "4.33.0-rc1", "4.33.0-rc2", "4.33.0", "4.33.1", "4.34.0-rc1", "4.34.0-rc2", "4.34.0", "4.34.1",
              "4.35.0-rc1", "4.35.0-rc2", "4.35.0-rc3", "4.35.0-rc4", "4.35.0", "4.36.0"]' || '["4.36.0"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-${{ matrix.lean_version }}-${{ matrix.os }}

      - name: Install cargo-nextest + cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          # cargo-public-api is version-pinned for a reproducible API gate.
          # Newer releases render the auto-derived `StructuralPartialEq` impl on
          # generic types with a `T: PartialEq` bound (via nightly rustdoc),
          # diverging from the committed docs/api-review baselines on toolchain
          # churn alone. Bumping the pin means regenerating the baselines in the
          # same commit (see docs/api-review.md).
          tool: cargo-nextest,cargo-public-api@0.52.0

      - name: Set up workflow linters
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install elan + Lean ${{ matrix.lean_version }}
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v${{ matrix.lean_version }}
          "$HOME/.elan/bin/elan" toolchain install "leanprover/lean4:v${{ matrix.lean_version }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Export LEAN_SYSROOT
        run: |
          prefix=$(scripts/lean-release-prefix.sh "${{ matrix.lean_version }}")
          printf 'LEAN_SYSROOT=%s\n' "$prefix" >> "$GITHUB_ENV"

      - name: Pin workspace to Lean ${{ matrix.lean_version }}
        run: |
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs-host/shims/lean-rs-interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > crates/lean-rs-host/shims/lean-rs-host-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > fixtures/lean/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > fixtures/interop-shims/lean-toolchain
          printf 'leanprover/lean4:v%s\n' "${{ matrix.lean_version }}" > templates/shipped-lean-crate/lean/lean-toolchain

      - name: Check clean-source Rust packaging before Lake fixture builds
        run: |
          rm -rf fixtures/lean/.lake fixtures/interop-shims/.lake
          cargo check -p lean-toolchain
          cargo check -p lean-rs-worker-parent

      - name: Build Lake packages
        run: |
          (cd crates/lean-rs/shims/lean-rs-interop-shims && lake build)
          if [ "${{ matrix.lean_version }}" != "4.36.0" ]; then
            (cd crates/lean-rs-host/shims/lean-rs-interop-shims && lake -R -KleanRsGeneratedShims=true build)
            (cd crates/lean-rs-host/shims/lean-rs-host-shims && lake -R -KleanRsGeneratedShims=true build)
          fi
          # This fresh CI checkout belongs to this job until its tests exit.
          chmod 700 fixtures/lean fixtures/interop-shims crates/lean-rs/shims/lean-rs-interop-shims
          (cd fixtures/lean && lake build)
          (cd fixtures/interop-shims && lake build)
          if [ "$RUNNER_OS" = "Linux" ]; then
            lean_lib_paths="$GITHUB_WORKSPACE/crates/lean-rs/shims/lean-rs-interop-shims/.lake/build/lib"
            if [ "${{ matrix.lean_version }}" != "4.36.0" ]; then
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-interop-shims/.lake/build/lib"
              lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/crates/lean-rs-host/shims/lean-rs-host-shims/.lake/build/lib"
            fi
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/lean/.lake/build/lib"
            lean_lib_paths="$lean_lib_paths:$GITHUB_WORKSPACE/fixtures/interop-shims/.lake/build/lib"
            echo "LD_LIBRARY_PATH=$lean_lib_paths${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Select job-owned scalar and callback fixtures
        if: matrix.lean_version == '4.36.0'
        run: |
          python3 scripts/select_test_fixtures.py >> "$GITHUB_ENV"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint workflows and their shell scripts
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        run: |
          actionlint
          shellcheck scripts/lean-release-prefix.sh scripts/publish-workspace.sh scripts/trybuild-linked-fixture-rustc.sh

      - name: Ask Lake, never read its files
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        # Lake decides what to build, where outputs live and whether they are current, so no file here reads
        # Lake's files or builds their paths. The search skips Markdown, Lean sources (lakefiles set Lake's own
        # layout), committed lake-manifest.json files, .gitignore files and comment lines. Every other exception
        # is listed below with the reason it remains.
        run: |
          command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }
          exceptions=(
            # This workflow, the release workflows and the local release gate put each Lake library directory on
            # the Linux loader path before any test starts. Asking `lake query` there instead needs a Linux run to
            # check. They also delete or skip whole `.lake` directories so a build or copy starts clean, and this
            # file holds this check's patterns.
            -g '!.github/workflows/ci.yml' -g '!.github/workflows/release.yml'
            -g '!.github/workflows/release-recover.yml' -g '!scripts/prerelease.sh'
            # This script deletes each `.lake` so no build from one Lean release survives into the next.
            -g '!scripts/test-all-toolchains.sh'
            # The metadata qualification harness seals a private copy of each project and digests every file Lake
            # built there, so it names Lake's output directories and keeps its own record under `.lake`.
            -g '!fixtures/metadata-qualification/**' -g '!scripts/qualify_metadata.py'
            -g '!scripts/tests/test_metadata_qualification.py' -g '!crates/lean-rs-host/tests/support/fixed_fixture.rs'
            # The profiling and callback fixtures pin each library by path and file identity before tests start,
            # and still build that path from Lake's layout and file names.
            -g '!scripts/select_test_fixtures.py' -g '!crates/lean-rs/examples/support/scalar_fixture.rs'
            -g '!crates/lean-rs/examples/support/callback_fixture.rs'
            # These tests write small Lake workspaces by hand, with a path dependency under `.lake/packages`, its
            # lake-manifest.json or an empty output directory, so Lake has a known case to answer.
            -g '!crates/lean-rs-host/tests/host_services.rs' -g '!crates/lean-rs-host/tests/batching.rs'
            -g '!crates/lean-rs-worker-child/tests/host_handle.rs'
            # A Lean package's committed lake-manifest.json is one of its sources. These files ship it, watch it or
            # digest it with the other sources, and leave `.lake` out of each source list; none of them parses it.
            -g '!Cargo.toml' -g '!crates/lean-rs-host/src/host/shim_sources.rs'
            -g '!crates/lean-rs-host/tests/interop_shims_parity.rs' -g '!crates/lean-toolchain/src/source_package.rs'
            -g '!scripts/check_package_docsrs.py'
            -g '!templates/shipped-lean-crate/build.rs' -g '!templates/shipped-lean-crate/src/support/deployment.rs'
          )
          status=0
          hits=$(rg -n --hidden -g '!.git' -g '!*.md' -g '!*.lean' -g '!lake-manifest.json' -g '!.gitignore' \
            "${exceptions[@]}" -e '\.lake\b' -e 'lake-manifest' -e 'packagesDir' -e 'lean-rs-generated' \
            -e 'join\("build"\)' -e "replace\(\s*['\"]_['\"]\s*,\s*['\"]__['\"]\s*\)" .) || status=$?
          test "$status" -le 1
          code=$(printf '%s\n' "$hits" | rg -v -e '^$' -e '^[^:]+:[0-9]+:\s*(//|#|--|\*|/\*)' || true)
          if [ -n "$code" ]; then
            printf 'These lines read Lake files or build Lake paths; ask Lake instead:\n%s\n' "$code"
            exit 1
          fi

      - name: Required SDK worker tests
        if: matrix.lean_version == '4.36.0'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ] && ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi
          cargo fetch --locked --manifest-path fixtures/metadata-qualification/app/Cargo.toml
          # Remove only the library path injected by this workflow's Lake setup.
          # The qualifier still refuses inherited preloads and other loader overrides.
          selection=$(env -u LD_LIBRARY_PATH python3 scripts/qualify_metadata.py broken-import --emit-host-selection --run-typed --workspace-shims)
          printf '%s\n' "$selection" | grep '^LEAN_RS_TEST_ORDINARY_HOST_SHIMS=' >> "$GITHUB_ENV"
          printf '%s\n' "$selection" | grep '^LEAN_RS_TEST_REMAINING_FILTER=' >> "$GITHUB_ENV"

      # Two Linux-specific overrides for the panic-handling tests in
      # `error::tests` and `runtime::*::tests`:
      #
      # 1. `RUST_BACKTRACE=0` — the default panic hook's backtrace
      #    capture walks the stack through `libleanshared.so` frames
      #    whose DWARF the glibc unwinder mis-decodes.
      #
      # 2. `LD_PRELOAD=libgcc_s.so.1` — `libleanshared.so` is a C++
      #    binary that statically links its own libstdc++ + `_Unwind_*`
      #    symbols. When dynamically loaded into the test binary,
      #    those symbols shadow glibc's libgcc_s unwinder; Rust panic
      #    unwinding then can't find catch_unwind's landing pads and
      #    aborts. Preloading the system libgcc_s forces it to win
      #    symbol resolution. macOS doesn't reproduce because Mach-O
      #    two-level namespaces scope symbol lookup per-image.
      - name: cargo nextest run
        env:
          RUST_BACKTRACE: "0"
          LD_PRELOAD: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/x86_64-linux-gnu/libgcc_s.so.1' || '' }}
        run: |
          if [ "${{ matrix.lean_version }}" = "4.36.0" ]; then
            test -n "${LEAN_RS_TEST_REMAINING_FILTER-}"
            python3 scripts/qualify_metadata.py workspace-tests "$LEAN_RS_TEST_REMAINING_FILTER"
          else
            cargo nextest run --workspace --profile ci -j1
          fi

      - name: cargo test --doc
        run: cargo test --doc --workspace

      - name: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      # docs.rs builds only on Linux, so the docs.rs-mode build only
      # needs to run on the Ubuntu cell.
      - name: docs.rs compatibility doc build
        if: matrix.os == 'ubuntu-latest'
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      # Packaging is version-independent, so this runs once on the head
      # cell rather than every Lean cell. Non-head cells repin the bundled
      # `lean-toolchain` files (which ship inside the crate packages), which
      # leaves the tree dirty and makes `cargo package` (no `--allow-dirty`)
      # fail; the head cell's repin is a no-op, so its tree stays clean.
      - name: Package tarball docs.rs simulation
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        run: python3 scripts/check_package_docsrs.py

      - name: Install Rust nightly (for cargo-public-api)
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        # Pinned date: the public-API diff renders nightly rustdoc, and the
        # auto-derived `StructuralPartialEq` bound on generic types changes
        # across nightlies. The baselines below are generated with this exact
        # nightly (+ cargo-public-api@0.52.0); bumping it means regenerating
        # every baseline in the same commit. Keep in lockstep with release.yml
        # and scripts/prerelease.sh. See docs/api-review.md.
        run: rustup toolchain install nightly-2026-06-18 --profile minimal

      - name: Public-API diff vs committed baselines
        if: matrix.os == 'ubuntu-latest' && matrix.lean_version == '4.36.0'
        run: |
          set -euo pipefail
          fail=0
          for crate in lean-rs-sys lean-toolchain lean-rs lean-rs-host \
                       lean-rs-worker-protocol lean-rs-worker-parent lean-rs-worker-child; do
            baseline="docs/api-review/${crate}-public.txt"
            if [ ! -f "$baseline" ]; then
              echo "::error::Missing baseline: $baseline"
              fail=1
              continue
            fi
            actual=$(mktemp)
            cargo +nightly-2026-06-18 public-api --simplified -p "$crate" > "$actual"
            if ! diff -u "$baseline" "$actual"; then
              echo "::error::Public-API drift for $crate. Regenerate $baseline in the same commit that changes public API."
              fail=1
            fi
          done
          exit "$fail"
