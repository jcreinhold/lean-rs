name: Compile-fail

# Runs the trybuild `.stderr` snapshot suites on a single OS + the repo's
# stable channel (`rust-toolchain.toml`). These snapshots capture
# `rustc` diagnostics whose wording/whitespace drifts across platforms and
# toolchain versions, so they are gated behind `RUN_TRYBUILD=1` and run only
# here—the per-PR `ci.yml` matrix does not. A stable-toolchain bump that
# changes a diagnostic requires regenerating the snapshots with
# `TRYBUILD=overwrite RUN_TRYBUILD=1 cargo test --test compile_fail_surface`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 8 * * 1"
  workflow_dispatch:

concurrency:
  group: compile-fail-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LEAN_VERSION_HEAD: "4.36.0"

jobs:
  compile-fail:
    name: Compile-fail snapshots (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Use the same stable rustc version locally when regenerating snapshots.
      # `rust-src` is required: some `.stderr` snapshots quote
      # the standard-library source (e.g. `PhantomData` in `core/src/marker.rs`)
      # in "required because it appears within the type" notes, and rustc only
      # renders that snippet when the std source is on disk. Regenerate
      # snapshots with `rust-src` installed so they match this job.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: compile-fail-${{ env.LEAN_VERSION_HEAD }}

      - name: Install elan + Lean ${{ env.LEAN_VERSION_HEAD }}
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v${{ env.LEAN_VERSION_HEAD }}
          "$HOME/.elan/bin/elan" toolchain install "leanprover/lean4:v${{ env.LEAN_VERSION_HEAD }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Export LEAN_SYSROOT
        # The sys build reads lean.h. The compile-pass consumer links the
        # installed shared runtime using the wrapper's rpath.
        run: |
          prefix=$(scripts/lean-release-prefix.sh "${{ env.LEAN_VERSION_HEAD }}")
          printf 'LEAN_SYSROOT=%s\n' "$prefix" >> "$GITHUB_ENV"

      - name: Run compile-fail snapshot suites
        env:
          RUN_TRYBUILD: "1"
          RUSTC_WRAPPER: ${{ github.workspace }}/scripts/trybuild-linked-fixture-rustc.sh
        run: |
          cargo test -p lean-rs-sys -p lean-rs -p lean-rs-host \
            --test compile_fail_surface
